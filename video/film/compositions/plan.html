<template>
  <style>
    @font-face { font-family: 'Stack Sans Headline'; src: url('assets/fonts/stack-sans-headline-300.woff2') format('woff2'); font-weight: 300; }
    @font-face { font-family: 'Stack Sans Text'; src: url('assets/fonts/stack-sans-text.woff2') format('woff2'); font-weight: 400 500; }
    #plan { position: absolute; inset: 0; overflow: hidden; background: #FFF4E8; font-family: 'Stack Sans Text', sans-serif; color: #1A0A22; }
    #plan-stage { position: absolute; inset: 0; }
    #plan-title { position: absolute; left: 192px; top: 150px; font-family: 'Stack Sans Headline', sans-serif; font-weight: 300; font-size: 104px; letter-spacing: -0.03em; line-height: 1; }
    #plan-title span { display: inline-block; margin-right: 0.22em; }
    .chip { position: absolute; padding: 14px 22px; border-radius: 999px; background: #FFD3AE; font-size: 28px; font-weight: 500; white-space: nowrap; }
    .chip.alt { background: #FFB020; }
    #plan-list { position: absolute; left: 192px; top: 380px; width: 1000px; }
    .pick { display: flex; align-items: center; gap: 22px; margin-bottom: 18px; padding: 22px 28px; border-radius: 20px; background: #FFD3AE; font-size: 30px; }
    .pick b { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: #1A0A22; color: #FFF4E8; font-size: 24px; font-weight: 500; }
    #plan-result { position: absolute; left: 1290px; top: 380px; width: 440px; padding: 30px 34px; border-radius: 26px; background: #2EC4B6; }
    #plan-num { font-family: 'Stack Sans Headline', sans-serif; font-weight: 300; font-size: 128px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    #plan-result p { margin-top: 8px; font-size: 26px; line-height: 1.25; }
    #plan-result small { display: block; margin-top: 10px; font-size: 28px; color: rgba(26, 10, 34, 0.7); }
  </style>
  <div id="plan" data-composition-id="plan" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <div id="plan-stage">
      <h2 id="plan-title"><span id="pt-0">Then</span><span id="pt-1">plan</span><span id="pt-2">around</span><span id="pt-3">it.</span></h2>
      <div id="plan-pile" data-layout-allow-overflow>
        <span class="chip" id="ch-0" style="left:1010px;top:420px;transform:rotate(-8deg)">Generator</span>
        <span class="chip alt" id="ch-1" style="left:1240px;top:520px;transform:rotate(6deg)">Raise / harden</span>
        <span class="chip" id="ch-2" style="left:1080px;top:640px;transform:rotate(-3deg)">Repair bridge</span>

        <span class="chip" id="ch-4" style="left:1450px;top:690px;transform:rotate(9deg)">Telecom mast #3587</span>
        <span class="chip" id="ch-5" style="left:900px;top:760px;transform:rotate(4deg)">Parvati Water Treatment Plant</span>
        <span class="chip alt" id="ch-6" style="left:1290px;top:830px;transform:rotate(-6deg)">Sinhagad Road Substation</span>
        <span class="chip" id="ch-7" style="left:1180px;top:300px;transform:rotate(10deg)">Generator</span>
      </div>
      <div id="plan-list">
        <div class="pick" id="pk-0"><b>1</b>Raise or harden Telecom mast #3587</div>
        <div class="pick" id="pk-1"><b>2</b>Raise or harden Parvati Water Treatment Plant</div>
        <div class="pick" id="pk-2"><b>3</b>Raise or harden Sinhagad Road Substation (Parvati)</div>

      <div id="plan-result">
        <div id="plan-num">−0%</div>
        <p>simulated impact, best plan of three moves</p>
        <small>89 plans tested</small>
      </div>

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Vertical blur smear into the scene.
    tl.fromTo('#plan-stage', { y: -260, filter: 'blur(18px)', opacity: 0.4 }, { y: 0, filter: 'blur(0px)', opacity: 1, duration: 0.28, ease: 'power4.out' }, 0);
    [0.4, 0.72, 1.04, 1.36].forEach((t, i) => tl.fromTo('#pt-' + i, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.14, ease: 'power4.out' }, t));
    // The pile of options lands...
    gsap.utils.toArray('.chip').forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'expo.out' }, 1.5 + i * 0.05));
    // ...and sorts itself into the optimizer's ranked plan.
    tl.to('.chip', { opacity: 0, y: 40, filter: 'blur(6px)', duration: 0.3, ease: 'power3.in', stagger: 0.03 }, 2.1);
    [0, 1, 2].forEach((i) => tl.fromTo('#pk-' + i, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out' }, 2.3 + i * 0.12));
    tl.fromTo('#plan-result', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, 2.9);
    const n = { v: 0 };
    const num = document.querySelector('#plan-num');
    tl.fromTo(n, { v: 0 }, { v: 10, duration: 0.8, ease: 'power3.out', onUpdate: () => { num.textContent = '−' + Math.round(n.v) + '%'; } }, 3.04);
    window.__timelines['plan'] = tl;
  </script>
